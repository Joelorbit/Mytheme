<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EyuTaste — Design System</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Fraunces:opsz,wght@9..144,400..700&family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const stored = localStorage.getItem('theme');
        const theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="/src/lib/tokens.css" />
  </head>
  <body>
    <svg class="grain-svg" aria-hidden="true">
      <filter id="grain">
        <feTurbulence type="turbulence" baseFrequency="0.69" />
      </filter>
    </svg>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
