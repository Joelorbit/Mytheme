<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EyuTheme — Frontend Boilerplate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Lexend:wght@100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const stored = localStorage.getItem('eyu-theme') || localStorage.getItem('theme');
        const savedMode = localStorage.getItem('eyu-mode');
        const systemMode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        const fallback = 'indigo-velvet';
        const theme = stored === 'light' ? 'eyu-light' : stored === 'dark' ? fallback : stored || fallback;
        const mode = savedMode === 'light' || savedMode === 'dark' ? savedMode : stored === 'light' || stored === 'dark' ? stored : systemMode;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.mode = mode;
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
    <link rel="stylesheet" href="/src/lib/tokens.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
